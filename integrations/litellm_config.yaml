# ==============================================================================
# LiteLLM Proxy Configuration for Swizzle Engine
# Compatible with LiteLLM v1.40.0+
# ==============================================================================
#
# Run LiteLLM Proxy with:
#   litellm --config integrations/litellm_config.yaml --port 4000
#
# Swizzle provides sub-40ms cached TTFT and automatic prompt token compression.
# ==============================================================================

model_list:
  # 1. Local VPC Gateway / Swizzle Runtime (AST-Tree + SecretVault + RAD-1 Fast-Apply)
  - model_name: swizzle/qwen-2.5-coder-7b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-7B-Instruct
      api_base: os.environ/SWIZZLE_BASE_URL  # defaults to http://localhost:8080/v1
      api_key: os.environ/SWIZZLE_API_KEY
    model_info:
      input_cost_per_token: 0.00000015
      cache_read_input_token_cost: 0.000000015  # 90% discount on cached prefixes
      output_cost_per_token: 0.00000045
      max_input_tokens: 32768
      max_output_tokens: 8192
      supports_function_calling: true
      supports_prompt_caching: true

general_settings:
  master_key: sk-swizzle-litellm-proxy-master
  pass_through_headers:
    - X-Swizzle-Tokens-Saved
    - X-Swizzle-Compression-Ratio
    - X-Swizzle-Cache-Hit-Tokens
    - X-Swizzle-AST-Reuse-Pct
    - X-Swizzle-Secrets-Redacted
    - X-Swizzle-Audit-Token
    - X-Swizzle-TTFT-Ms
